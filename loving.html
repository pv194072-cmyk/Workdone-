{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<section class="form-page login-page"><div class="form-intro"><span class="eyebrow">Your WorkDone space</span><h1>Welcome back.</h1><p>Sign in to continue to your applicant or hiring board dashboard.</p></div><form class="form-card" method="post"><h2>Log in</h2><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required></label><button class="button full">Log in</button><p class="form-bottom">New to WorkDone? <a href="{{ url_for('register') }}">Create an account</a></p></form></section>{% endblock %}
